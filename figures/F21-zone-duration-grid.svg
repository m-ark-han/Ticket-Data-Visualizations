<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 760" role="img" aria-labelledby="title desc">
<title id="title">F21: Days to 90% of recorded volume by debris zone</title>
<desc id="desc">Thirty cells show the exact number of days from the first ticket until each zone reached 90 percent of its own recorded cubic yards. Darker cells mean more days.</desc>
